[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "covariance-shift-lab"
version = "0.1.0"
description = "Controlled experiments on covariance estimation under limited data and regime changes"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4", "matplotlib>=3.8"]
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
covariance-shift = "covariance_shift.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
